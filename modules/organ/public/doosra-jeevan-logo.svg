<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .dj-head { fill: #0b388f; }
      .dj-orange { fill: #f97316; }
      .dj-green { fill: #16a34a; }
      .dj-green-stroke { stroke: #15803d; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dj-text { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 38px; fill: #1e293b; letter-spacing: -0.5px; }
    </style>
  </defs>

  <!-- 1. Deep Blue Circular Head -->
  <circle cx="276" cy="148" r="23" class="dj-head" />

  <!-- 2. Saffron / Warm Orange Torso & Raised Right Arm -->
  <path d="M 270 184 C 295 165, 328 130, 340 85 C 332 145, 308 205, 280 256 C 266 238, 252 212, 270 184 Z" class="dj-orange" />

  <!-- 3. Left Green Leaf with Central White Vein -->
  <!-- Upper Leaf Shape -->
  <path d="M 142 135 C 195 135, 246 168, 258 220 C 232 225, 185 220, 142 135 Z" class="dj-green" />
  <!-- Inner Leaf White Vein Arc -->
  <path d="M 142 135 C 190 172, 235 196, 258 220" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- 4. Sweeping Green Dynamic Stem & Extended Left Leg Arc -->
  <path d="M 258 220 C 282 280, 265 328, 140 378 C 225 330, 288 285, 268 198 Z" class="dj-green" />

  <!-- 5. Leaping Right Leg Green Dynamic Outline -->
  <path d="M 264 240 C 310 240, 360 252, 360 280 C 338 310, 308 326, 326 348 C 298 338, 286 298, 325 272 C 300 270, 272 260, 264 294" class="dj-green-stroke" />

  <!-- 6. Logo Typography: Doosra Jeevan !! -->
  <text x="250" y="415" text-anchor="middle" class="dj-text">Doosra Jeevan !!</text>
</svg>
